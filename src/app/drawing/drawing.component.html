<div class="drawing-shell">
  <aside class="tool-sidebar">
    <div class="tool-rail" role="toolbar" aria-label="Drawing tools">
      <button
        *ngFor="let tool of toolOptions"
        type="button"
        class="tool-chip"
        [class.tool-chip-active]="activeTool === tool.key && showToolPanel"
        [style.--tool-accent]="tool.accent"
        (click)="selectTool(tool.key)"
        [attr.aria-pressed]="activeTool === tool.key && showToolPanel"
        [title]="tool.label"
      >
        <img [src]="tool.icon" [alt]="tool.label" class="tool-chip-icon" />
      </button>
    </div>
  </aside>

  <header class="top-navbar">
    <div class="navbar-group navbar-primary">
      <button
        pButton
        type="button"
        icon="pi pi-undo"
        class="nav-icon-button"
        [disabled]="allStrokes.length === 0"
        (click)="undo()"
        title="Undo"
      ></button>
      <button
        pButton
        type="button"
        icon="pi pi-refresh"
        class="nav-icon-button"
        [disabled]="redoStack.length === 0"
        (click)="redo()"
        title="Redo"
      ></button>

      <span class="nav-divider"></span>

      <button
        pButton
        type="button"
        icon="pi pi-upload"
        class="nav-icon-button"
        (click)="triggerUpload()"
        title="Upload"
      ></button>
      <button
        pButton
        type="button"
        icon="pi pi-download"
        class="nav-icon-button"
        (click)="saveSVG()"
        title="Download"
      ></button>
      <button
        pButton
        type="button"
        icon="pi pi-trash"
        class="nav-icon-button"
        (click)="clearCanvas()"
        title="Delete"
      ></button>
    </div>

    <div *ngIf="showContextNavbar" class="navbar-group navbar-context">
      <div class="context-tool-badge" [style.--tool-accent]="activeToolMeta?.accent">
        <img
          [src]="activeToolMeta?.icon"
          [alt]="displayToolLabel || 'Selected tool'"
          class="context-tool-icon"
        />
        <span class="context-tool-label">{{ displayToolLabel }}</span>
      </div>

      <ng-container *ngIf="activeTool !== 'eraser'; else eraserNavbar">
        <div class="context-control compact-range">
          <label>Size</label>
          <input
            type="range"
            min="1"
            max="100"
            [(ngModel)]="tools[activeTool].size"
          />
          <span>{{ tools[activeTool].size }}</span>
        </div>

        <div class="context-control compact-range">
          <label>Smooth</label>
          <input
            type="range"
            min="0"
            max="1"
            step="0.01"
            [(ngModel)]="tools[activeTool].smoothing"
          />
          <span>{{ tools[activeTool].smoothing }}</span>
        </div>

        <div class="context-control compact-range">
          <label>Stream</label>
          <input
            type="range"
            min="0"
            max="1"
            step="0.01"
            [(ngModel)]="tools[activeTool].streamline"
          />
          <span>{{ tools[activeTool].streamline }}</span>
        </div>

        <div class="context-control compact-range">
          <label>Thin</label>
          <input
            type="range"
            min="0"
            max="1"
            step="0.01"
            [(ngModel)]="tools[activeTool].thinning"
          />
          <span>{{ tools[activeTool].thinning }}</span>
        </div>

        <label class="context-color-control">
          <span>Color</span>
          <input type="color" [(ngModel)]="tools[activeTool].color" />
        </label>

        <label class="context-color-control">
          <span>Outline</span>
          <input type="color" [(ngModel)]="tools[activeTool].outline.color" />
        </label>

        <div class="context-control compact-range">
          <label>Stroke</label>
          <input
            type="range"
            min="0"
            max="100"
            [(ngModel)]="tools[activeTool].outline.width"
          />
          <span>{{ tools[activeTool].outline.width }}</span>
        </div>

        <button
          pButton
          type="button"
          icon="pi pi-refresh"
          class="nav-icon-button"
          (click)="resetPenSettings()"
          title="Reset pen"
        ></button>
      </ng-container>

      <ng-template #eraserNavbar>
        <div class="context-control compact-range">
          <label>Size</label>
          <input type="range" min="8" max="120" [(ngModel)]="tools.eraser.size" />
          <span>{{ tools.eraser.size }}</span>
        </div>
      </ng-template>
    </div>

    <div class="navbar-group navbar-secondary">
      <button
        pButton
        type="button"
        label="Share"
        class="share-button"
        (click)="sendToProject()"
      ></button>
    </div>
  </header>

  <input
    id="svgUpload"
    type="file"
    accept=".svg"
    style="display: none"
    (change)="handleFileUpload($event)"
  />

  <svg
    #svgElement
    class="drawing-canvas"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp()"
    (dragover)="$event.preventDefault()"
    (drop)="onFileDrop($event)"
  >
    <g *ngFor="let s of allStrokes">
      <path
        [attr.d]="s.path"
        [attr.fill]="s.color"
        [attr.fill-opacity]="s.opacity"
        [attr.stroke]="s.outlineColor"
        [attr.stroke-width]="s.outlineWidth"
        stroke-linejoin="round"
      />
    </g>
    <path
      *ngIf="previewPath"
      [attr.d]="previewPath"
      [attr.fill]="tools[activeTool].color"
      [attr.fill-opacity]="tools[activeTool].opacity"
      [attr.stroke]="tools[activeTool].outline.color"
      [attr.stroke-width]="tools[activeTool].outline.width"
      stroke-linejoin="round"
    />
  </svg>
</div>
